<div class="broadcast-field markdown-toolbar-field">
  <span class="field-label">Markdown Formatting</span>
  <div class="markdown-toolbar" data-markdown-toolbar="{{ toolbar_target }}">
    <button type="button" class="markdown-tool markdown-tool-glyph" data-markdown-target="{{ toolbar_target }}" data-md-wrap="**" title="Bold" aria-label="Bold"><strong>B</strong></button>
    <button type="button" class="markdown-tool markdown-tool-glyph" data-markdown-target="{{ toolbar_target }}" data-md-wrap="_" title="Italic" aria-label="Italic"><em>I</em></button>
    <div class="markdown-tool-group">
      <button type="button" class="markdown-tool markdown-tool-glyph markdown-tool-heading-trigger" title="Headings" aria-label="Headings">H</button>
      <div class="markdown-tool-menu">
        <button type="button" class="markdown-tool markdown-tool-menu-item" data-markdown-target="{{ toolbar_target }}" data-md-prefix="# " title="Heading 1" aria-label="Heading 1">H1</button>
        <button type="button" class="markdown-tool markdown-tool-menu-item" data-markdown-target="{{ toolbar_target }}" data-md-prefix="## " title="Heading 2" aria-label="Heading 2">H2</button>
        <button type="button" class="markdown-tool markdown-tool-menu-item" data-markdown-target="{{ toolbar_target }}" data-md-prefix="### " title="Heading 3" aria-label="Heading 3">H3</button>
      </div>
    </div>
    <button type="button" class="markdown-tool markdown-tool-glyph markdown-tool-icon" data-markdown-target="{{ toolbar_target }}" data-md-prefix="- " title="Bullet List" aria-label="Bullet List">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="6" cy="7" r="1.8"></circle>
        <circle cx="6" cy="12" r="1.8"></circle>
        <circle cx="6" cy="17" r="1.8"></circle>
        <path d="M10 7h8"></path>
        <path d="M10 12h8"></path>
        <path d="M10 17h8"></path>
      </svg>
    </button>
    <button type="button" class="markdown-tool markdown-tool-glyph" data-markdown-target="{{ toolbar_target }}" data-md-prefix="[Link text](https://)" title="Link" aria-label="Link">🔗</button>
    <button type="button" class="markdown-tool markdown-tool-glyph" data-markdown-target="{{ toolbar_target }}" data-md-template="[https://example.com/image.png]" title="Image URL" aria-label="Image URL">🖼</button>
    <button type="button" class="markdown-tool markdown-tool-glyph" data-markdown-target="{{ toolbar_target }}" data-md-template="[https://example.com/video.mp4]" title="Video URL" aria-label="Video URL">▶</button>
  </div>
</div>
